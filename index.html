<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmanuel Magallanes Ulloa</title>
    <style>
        /* Estilos Base: Fondo negro puro para máxima sofisticación */
        body { 
            background: #000000; 
            color: #d1d1d1; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 30px;
            box-sizing: border-box;
        }
        
        /* Contenedor Principal (Tarjeta) */
        .card { 
            text-align: center; 
            width: 100%; 
            max-width: 320px; /* Ancho optimizado para móviles */
        }
        
        /* Contenedor de la Foto: Soluciona el problema de la forma irregular */
        .profile-img-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 25px auto;
            border-radius: 50%; /* Recorte circular perfecto */
            overflow: hidden; /* Oculta el sobrante de la foto vertical */
            border: 2px solid #222; /* Borde sutil */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        /* La Foto en sí: Se ajusta y centra automáticamente */
        .profile-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Clave: ajusta la foto sin deformarla */
            object-position: center 20%; /* Centra tu rostro */
        }
        
        /* Tipografía Académica */
        h1 { 
            font-size: 1.6rem; 
            font-weight: 500; 
            margin: 0 0 5px 0; 
            color: #ffffff;
            letter-spacing: -0.5px; 
        }
        
        .institution { 
            color: #888888; 
            font-size: 0.9rem; 
            font-weight: 400;
            margin: 0 0 35px 0; 
        }
        
        /* Separadores de Sección */
        .section-title {
            text-align: left;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #444;
            margin-bottom: 12px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 6px;
        }
        
        /* Botones de Acción (Minimalistas y Oscuros) */
        .btn { 
            display: flex; 
            align-items: center;
            justify-content: center;
            background: #111111;
            border: 1px solid #2a2a2a; 
            color: #d1d1d1; 
            text-decoration: none; 
            padding: 15px; 
            margin-bottom: 14px; 
            border-radius: 10px; 
            font-size: 0.9rem; 
            font-weight: 500;
            transition: all 0.2s ease; 
        }
        
        /* Efecto al pasar el cursor o tocar */
        .btn:hover { 
            background: #1a1a1a; 
            border-color: #444; 
            color: #ffffff;
            transform: translateY(-1px); /* Pequeño levante sutil */
        }
        
        /* Correos electrónicos (Texto fino, no botones, para no saturar) */
        .email-list {
            margin-bottom: 30px;
        }
        .email-text {
            font-size: 0.8rem;
            color: #777;
            margin-bottom: 10px;
            display: block;
            text-decoration: none;
            word-break: break-all; /* Rompe el mail si es muy largo en pantalla chica */
        }
        .email-text:hover { color: #ffffff; }

        /* Iconos sutiles (Emojis) */
        .icon {
            margin-right: 10px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="profile-img-container">
            <img src="foto.jpg" alt="Emmanuel Magallanes Ulloa" class="profile-img">
        </div>
        
        <h1>Emmanuel Magallanes Ulloa</h1>
        <p class="institution">Académico / Investigador</p>
        
        <div class="section-title">Contacto</div>
        
        <a href="https://wa.me/524931912255?text=%C2%A1Hola%20Emmanuel!%20Acabo%20de%20escanear%20tu%20tarjeta." class="btn" target="_blank">
    <span class="icon">💬</span> WhatsApp
</a>    
        <div class="email-list">
            <a href="mailto:emagallanes.u2@gmail.com" class="email-text">emagallanes.u2@gmail.com</a>
            <a href="mailto:emagallanes@upz.edu.mx" class="email-text">emagallanes@upz.edu.mx</a>
        </div>
        
        <div class="section-title">Perfil Académico & Más</div>
        
        <a href="https://www.researchgate.net/home" class="btn" target="_blank">
            <span class="icon">🔬</span> ResearchGate
        </a>
        
        <a href="https://open.spotify.com/show/2AV47RVAM5jcJlzs2ZGMfu?si=96babc5d7b954ee8" class="btn" target="_blank">
            <span class="icon">🎵</span> Perfil Spotify
        </a>
    </div>
</body>
</html>
